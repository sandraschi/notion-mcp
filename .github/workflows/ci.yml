name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check server.py run_server.py notion_mcp/ scripts/ tests/ mcpb/ web_sota/backend/

      - name: Typecheck with Pyright
        run: uv run pyright notion_mcp/ server.py

      - name: Test with pytest
        run: uv run --group dev pytest -x --tb=short -k "not slow"

  webapp:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web_sota

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Lint frontend with Biome
        run: bun run biome:ci

      - name: Build frontend (tsc + vite + Tailwind CSS gate)
        run: bun run build

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install backend deps (e2e webServer)
        run: uv sync --group dev
        working-directory: ${{ github.workspace }}

      - name: Install Playwright browsers
        run: bunx playwright install chromium --only-shell

      - name: Run e2e (backend + frontend webServers)
        run: bun run test:e2e
